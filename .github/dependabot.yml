version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      radix:
        patterns: ["@radix-ui/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
