name: Release

# Push a tag like v0.1.0 → run CI → build every package on GitHub runners → publish a public
# GitHub Release with exactly these files: .AppImage, .deb, .flatpak, .dmg, the macOS self-update
# bundle (.app.tar.gz), latest.json, the driver binaries and drivers.json (`gh release create`).
# The self-update bundles are signed with the TAURI_SIGNING_PRIVATE_KEY repository secret (and
# its _PASSWORD); the app checks them against `plugins.updater.pubkey` in tauri.conf.json.
# A PR that changes this file, or a manual run (workflow_dispatch), builds the packages as
# workflow artifacts without publishing.
# Actions are pinned by commit SHA; the comment names the release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The version in Cargo.toml names every package. On a tag push it must match the tag,
  # otherwise the release would ship files with the wrong version.
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=$(sh packaging/version.sh)" >> "$GITHUB_OUTPUT"
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
      # The release notes are the version's section of CHANGELOG.md; checked here, before the builds.
      - name: CHANGELOG.md has notes for the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh packaging/release-notes.sh "$VERSION" > /dev/null
      - name: Updater public key is set
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -c '
          import json, sys
          if not json.load(open("src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"]:
              sys.exit("::error::plugins.updater.pubkey in tauri.conf.json is empty: the release could not update itself.")
          '

  ci:
    uses: ./.github/workflows/ci.yml

  ui:
    needs: [version, ci]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate Flatpak cargo sources
        run: |
          pip install --user aiohttp tomlkit
          curl -sSfL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-dist
          path: |
            ui/dist
            packaging/flatpak/cargo-sources.json
          retention-days: 1

  flatpak:
    needs: [version, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-dist
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40 # master
        with:
          bundle: quarry-${{ needs.version.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/io.github.mindulabs.Quarry.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-flatpak
          path: quarry-${{ needs.version.outputs.version }}.flatpak
          if-no-files-found: error

  # Ubuntu 22.04: the oldest distro with WebKitGTK 4.1, so the packages run on older glibc too.
  linux:
    needs: [version, ci]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libssl-dev \
            file patchelf xdg-utils
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: sh packaging/release-build.sh --bundles appimage,deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: |
            target/release/bundle/appimage/Quarry_${{ needs.version.outputs.version }}_amd64.AppImage
            target/release/bundle/deb/Quarry_${{ needs.version.outputs.version }}_amd64.deb
          if-no-files-found: error
      # The AppImage is its own update bundle; only its signature goes on, into latest.json.
      - if: steps.build.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-signature-linux
          path: target/release/bundle/appimage/Quarry_${{ needs.version.outputs.version }}_amd64.AppImage.sig
          if-no-files-found: error

  # .dmg can only be built on macOS.
  macos:
    needs: [version, ci]
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      # `app` too: the self-update bundle is made from the .app.
      - id: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: sh packaging/release-build.sh --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: target/universal-apple-darwin/release/bundle/dmg/Quarry_${{ needs.version.outputs.version }}_universal.dmg
          if-no-files-found: error
      # Tauri names the bundle after the app only; the release file carries the version.
      - name: Name the update bundle
        if: steps.build.outputs.signed == 'true'
        working-directory: target/universal-apple-darwin/release/bundle/macos
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv Quarry.app.tar.gz "Quarry_${VERSION}_universal.app.tar.gz"
          mv Quarry.app.tar.gz.sig "Quarry_${VERSION}_universal.app.tar.gz.sig"
      - if: steps.build.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-update
          path: target/universal-apple-darwin/release/bundle/macos/Quarry_${{ needs.version.outputs.version }}_universal.app.tar.gz
          if-no-files-found: error
      - if: steps.build.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-signature-macos
          path: target/universal-apple-darwin/release/bundle/macos/Quarry_${{ needs.version.outputs.version }}_universal.app.tar.gz.sig
          if-no-files-found: error

  # Drivers ship apart from the app and are downloaded on first use (crates/engine/src/install.rs).
  # Linux is built on 22.04 like the app, so the binaries run on the same glibc.
  drivers:
    needs: [version, ci]
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PACKAGES: quarry-driver-mysql quarry-driver-postgres quarry-driver-sqlserver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin, x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: ${{ matrix.target }}
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p out
          packages=""
          for p in $PACKAGES; do packages="$packages -p $p"; done
          if [ "$TARGET" = universal-apple-darwin ]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo build --profile driver --locked --target "$t" $packages --bins
            done
            for p in $PACKAGES; do
              lipo -create -output "out/$p-$TARGET" \
                "target/aarch64-apple-darwin/driver/$p" "target/x86_64-apple-darwin/driver/$p"
            done
          else
            cargo build --profile driver --locked --target "$TARGET" $packages --bins
            for p in $PACKAGES; do cp "target/$TARGET/driver/$p" "out/$p-$TARGET"; done
          fi
          # Each must answer `hello` before it ships.
          for p in $PACKAGES; do "out/$p-$TARGET" hello > /dev/null; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-drivers-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # drivers.json: for each driver and target, the release file's URL and SHA-256.
  drivers-manifest:
    needs: [version, drivers]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-drivers-*
          merge-multiple: true
          path: out
      - name: Write drivers.json
        env:
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          packages = {}
          for f in sorted(pathlib.Path("out").iterdir()):
              package, target = None, None
              for t in ("x86_64-unknown-linux-gnu", "universal-apple-darwin"):
                  if f.name.endswith("-" + t):
                      package, target = f.name[: -len(t) - 1], t
              if package is None:
                  raise SystemExit(f"unexpected file {f.name}")
              sha = hashlib.sha256(f.read_bytes()).hexdigest()
              packages.setdefault(package, {})[target] = {
                  "url": f"{os.environ['BASE']}/{f.name}",
                  "sha256": sha,
              }
          pathlib.Path("drivers.json").write_text(json.dumps({"packages": packages}, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-drivers-manifest
          path: drivers.json
          if-no-files-found: error

  # latest.json: what the macOS app and the AppImage read to update themselves. Built only when the
  # bundles were signed (a tag always is, see packaging/release-build.sh).
  updater-manifest:
    if: needs.linux.outputs.signed == 'true' && needs.macos.outputs.signed == 'true'
    needs: [version, linux, macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: updater-signature-*
          merge-multiple: true
          path: sig
      - name: Write latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}
        run: |
          python3 packaging/updater-manifest.py "$VERSION" "$BASE" \
            --macos "sig/Quarry_${VERSION}_universal.app.tar.gz.sig" \
            --appimage "sig/Quarry_${VERSION}_amd64.AppImage.sig" > latest.json
          cat latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-updater-manifest
          path: latest.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, flatpak, linux, macos, drivers-manifest, updater-manifest]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sh packaging/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quarry $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
