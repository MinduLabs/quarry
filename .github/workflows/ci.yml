name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    # Ubuntu 24.04 = baseline GTK 4.14 / libadwaita 1.5 (ADR 0004)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev gettext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    name: Integration (MySQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Start test databases
        run: docker compose -f tests/docker-compose.yml up -d --wait
      - name: Install GTK dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p quarry-driver-mysql -p quarry-engine
        env:
          QUARRY_TEST_MYSQL: 127.0.0.1:13306

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  data:
    name: Validate desktop & metainfo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
      - run: desktop-file-validate data/io.github.mindulabs.Quarry.desktop
      - run: appstreamcli validate --no-net --explain data/io.github.mindulabs.Quarry.metainfo.xml

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: quarry.flatpak
          manifest-path: build-aux/flatpak/io.github.mindulabs.Quarry.json
          cache-key: flatpak-builder-${{ github.sha }}
