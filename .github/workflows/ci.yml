name: CI

# Every push to main and every PR: lint, unit tests (Linux and macOS), MySQL integration tests,
# licenses, desktop metadata. Packaging runs in release.yml, which calls this workflow first.
# Docs-only changes skip CI (paths-ignore).
# Actions are pinned by commit SHA; the comment names the release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI · Biome · tsc · build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  rust:
    name: fmt · clippy · test (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # generate_context! checks that frontendDist exists.
      - run: mkdir -p ui/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Bindings are up to date
        run: git diff --exit-code ui/src/bindings

  rust-macos:
    name: clippy · test (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: mkdir -p ui/dist
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  integration:
    name: Integration (MySQL)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start test databases
        run: docker compose -f tests/docker-compose.yml up -d --wait
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: cargo test -p quarry-driver-mysql -p quarry-engine --locked
        env:
          QUARRY_TEST_MYSQL: 127.0.0.1:13306
          QUARRY_TEST_SSH: 127.0.0.1:12222

  deny:
    name: cargo-deny
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  data:
    name: Validate desktop & metainfo
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends desktop-file-utils appstream
      - run: desktop-file-validate packaging/linux/io.github.mindulabs.Quarry.desktop
      # appstreamcli 0.15 on Ubuntu 22.04 predates AppStream 1.0 and flags its
      # <url type="vcs-browser"> as invalid. Fail on every error and every other warning.
      - name: Validate metainfo
        run: |
          appstreamcli validate --no-net --format yaml \
            packaging/linux/io.github.mindulabs.Quarry.metainfo.xml > appstream.yml || true
          grep -q '^Validator:' appstream.yml
          cat appstream.yml
          awk '
            function check() {
              if (tag != "" && (sev == "error" || sev == "warning") \
                  && !(tag == "url-invalid-type" && hint == "vcs-browser")) {
                print "::error::" tag " (" sev "): " hint; bad = 1
              }
            }
            /^- tag:/ { check(); tag = $3; sev = ""; hint = "" }
            /^  severity:/ { sev = $2 }
            /^  hint:/ { hint = $2 }
            END { check(); exit bad }
          ' appstream.yml
