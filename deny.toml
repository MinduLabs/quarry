# cargo-deny: block security advisories and incompatible licenses.
# Third-party GPL/AGPL is blocked so the project keeps the option to relicense (see CONTRIBUTING.md, CLA).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities and yanked crates fail at any depth. "Unmaintained" notices fail only for crates
# we depend on directly: RustSec publishes them for deep dependencies we cannot change (zbus via
# the keyring, gtk via Tauri), and each one turned every open PR red overnight.
unmaintained = "workspace"
# Each ignore names where the crate comes from and why we cannot drop it. Remove it once we can.
ignore = [
    # Unmaintained, not a vulnerability. A direct dependency of most crates (timestamps in the
    # engine, history, exports, drivers) and of ts-rs and rust_xlsxwriter through their chrono
    # features. Moving to jiff or time is its own change.
    { id = "RUSTSEC-2026-0543", reason = "chrono: used directly for timestamps; replacing it is a separate migration" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy; not every license is in use.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
# Quarry's own crates are AGPL.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quarry" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-model" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-driver-api" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-driver-proto" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-driver-postgres" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-driver-sqlserver" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-sql" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-store" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-tunnel" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-export" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-import" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-engine" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-driver-mysql" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
