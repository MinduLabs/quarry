# cargo-deny: block security advisories and incompatible licenses.
# Third-party GPL/AGPL is blocked so the project keeps the option to relicense (see CONTRIBUTING.md, CLA).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each ignore names where the crate comes from and why we cannot drop it. Remove it once upstream does.
ignore = [
    # Unmaintained, not a vulnerability. Pulled in by tauri → gtk 0.18 → glib-macros (Linux only);
    # Tauri ignores it too (tauri-apps/tauri .cargo/audit.toml).
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via Tauri's GTK3 bindings; no fix available to us" },
    # Unmaintained, not vulnerabilities: merged into zbus 6. Pulled in by oo7 0.6 (Linux keyring) →
    # zbus 5. oo7 0.6 is the latest stable; 0.7 is a beta that needs Rust 1.95. Drop these when oo7
    # ships a stable release on zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via oo7 0.6 → zbus 5; no stable oo7 on zbus 6 yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via oo7 0.6 → zbus 5; no stable oo7 on zbus 6 yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via oo7 0.6 → zbus 5; no stable oo7 on zbus 6 yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy; not every license is in use.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]
# Quarry's own crates are AGPL.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quarry" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-model" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-driver-api" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-sql" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-store" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-tunnel" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-engine" },
    { allow = ["AGPL-3.0-or-later"], crate = "quarry-driver-mysql" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
