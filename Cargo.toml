[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/driver-api",
    "crates/sql",
    "crates/store",
    "crates/tunnel",
    "crates/drivers/mysql",
    "crates/engine",
    "src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MinduLabs/quarry"
authors = ["Quarry contributors"]

[workspace.dependencies]
# Internal crates
quarry-model = { path = "crates/model" }
quarry-driver-api = { path = "crates/driver-api" }
quarry-sql = { path = "crates/sql" }
quarry-store = { path = "crates/store" }
quarry-tunnel = { path = "crates/tunnel" }
quarry-engine = { path = "crates/engine" }
quarry-driver-mysql = { path = "crates/drivers/mysql" }

# Core
async-channel = "2.5"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
directories = "6"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# SSH tunnels: ring for crypto (rustls already uses it), no compression. No `rsa` feature: the
# `rsa` crate has an unfixed timing side channel (RUSTSEC-2023-0071). RSA keys still work through
# ssh-agent, which signs outside Quarry.
russh = { version = "0.64", default-features = false, features = ["ring"] }

# Desktop shell
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-window-state = "2"
# The GTK 3 bindings Tauri already uses on Linux, to stop the webview's pinch-zoom gesture.
gtk = "0.18"
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }

# macOS Keychain
security-framework = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "warn"

# Debug builds: line tables for our crates, no debug info for dependencies. Full debug info for
# every dependency is what made target/debug many GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Size-first release profile, as recommended by https://v2.tauri.app/concept/size/.
# `panic = "abort"` is left out on purpose: a panic in one engine task would then kill the whole app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
