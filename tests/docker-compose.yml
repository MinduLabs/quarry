# Databases for integration tests (`just test-db` starts them).
#   docker compose -f tests/docker-compose.yml up -d --wait
# MySQL: 127.0.0.1:13306, user quarry / password quarry (test values only)
# PostgreSQL: 127.0.0.1:15432, user quarry / password quarry, database shop (test values only)
# SQL Server: 127.0.0.1:11433, user sa / password Quarry-test-1, database shop (test values only)
# SSH:   127.0.0.1:12222, user quarry / password quarry; forwards to the `mysql` service
services:
  mysql:
    image: mysql:8.4
    container_name: quarry-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: quarry-root
      MYSQL_USER: quarry
      MYSQL_PASSWORD: quarry
      MYSQL_DATABASE: shop
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./fixtures/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uquarry", "-pquarry"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17
    container_name: quarry-test-postgres
    environment:
      POSTGRES_USER: quarry
      POSTGRES_PASSWORD: quarry
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./fixtures/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "quarry", "-d", "shop"]
      interval: 2s
      timeout: 2s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: quarry-test-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Quarry-test-1
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - ./fixtures/sqlserver:/fixtures:ro
    # SQL Server runs no init scripts of its own: start it, load the fixtures into a fresh server
    # as the other databases do, then keep it in the foreground.
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        server=$$!
        sql="/opt/mssql-tools18/bin/sqlcmd -C -b -S 127.0.0.1 -U sa -P Quarry-test-1"
        until $$sql -Q "SELECT 1" > /dev/null 2>&1; do sleep 1; done
        if [ "$$($$sql -h -1 -Q "SET NOCOUNT ON; SELECT DB_ID('shop')" | tr -d ' ')" = NULL ]; then
          for f in /fixtures/*.sql; do $$sql -i "$$f" || exit 1; done
        fi
        wait $$server
    healthcheck:
      # Healthy once the fixtures are in.
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "127.0.0.1", "-U", "sa", "-P", "Quarry-test-1", "-d", "shop", "-Q", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 60

  ssh:
    build: ./ssh
    container_name: quarry-test-ssh
    ports:
      - "127.0.0.1:12222:22"
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "22"]
      interval: 2s
      timeout: 2s
      retries: 30
