[package]
name = "quarry-driver-proto"
description = "The wire between the engine and a driver running in its own process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
quarry-model.workspace = true
quarry-driver-api.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
# Floats must come back bit for bit; the default parser may be off by one unit in the last place.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "net", "process", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
