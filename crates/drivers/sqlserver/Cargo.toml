[package]
name = "quarry-driver-sqlserver"
description = "Microsoft SQL Server driver for Quarry (tiberius, rustls)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
quarry-model.workspace = true
quarry-driver-api.workspace = true
quarry-driver-proto.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio = { workspace = true, features = ["net"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
quarry-driver-api = { workspace = true, features = ["testing"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
