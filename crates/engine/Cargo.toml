[package]
name = "quarry-engine"
description = "Headless application core: connections, query execution, safe mode."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
quarry-model.workspace = true
quarry-driver-api.workspace = true
quarry-driver-proto.workspace = true
quarry-export.workspace = true
quarry-import.workspace = true
quarry-store.workspace = true
quarry-sql.workspace = true
quarry-tunnel.workspace = true
async-channel.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
# Driver downloads and the update check: TLS through ring, as everywhere else in Quarry.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
semver = "1"
futures-util.workspace = true

[dev-dependencies]
# Unit tests run MySQL inside the engine; Quarry itself runs it from its binary.
quarry-driver-mysql.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
uuid.workspace = true

[lints]
workspace = true
